apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin4-oidc-config
  namespace: pgadmin
data:
  config_local.py: |
    import os

    MASTER_PASSWORD_REQUIRED = False
    OAUTH2_CLIENT_SECRET = os.environ['KEYCLOAK_OIDC_SECRET']

    # Enable OIDC Authentication
    AUTHENTICATION_SOURCES = ['oauth2']
    
    # OAUTH2 Configuration
    OAUTH2_CONFIG = [{
      'OAUTH2_NAME': 'Keycloak',
      'OAUTH2_DISPLAY_NAME': 'Keycloak OIDC',

      'OAUTH2_CLIENT_ID': 'pgadmin4',
      'OAUTH2_CLIENT_SECRET': OAUTH2_CLIENT_SECRET,

      'OAUTH2_SERVER_METADATA_URL': 'https://iam.homelab.kbushby.com/realms/master/.well-known/openid-configuration',

      'OAUTH2_BUTTON_COLOR': '#0000ff',
      'OAUTH2_SCOPE': 'openid profile email'
    }]

    OAUTH2_AUTO_CREATE_USER = True
  