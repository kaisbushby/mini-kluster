apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: ceph-s3-dev
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: osd
    replicated:
      size: 3
  dataPool:
    failureDomain: osd
    erasureCoded:
      dataChunks: 2
      codingChunks: 1
  preservePoolsOnDelete: true
  gateway:
    # sslCertificateRef:
    # caBundleRef:
    port: 80
    # securePort: 443
    instances: 1
    # A key/value list of annotations
    annotations:
    #  key: value
    placement:
    #  nodeAffinity:
    #    requiredDuringSchedulingIgnoredDuringExecution:
    #      nodeSelectorTerms:
    #      - matchExpressions:
    #        - key: role
    #          operator: In
    #          values:
    #          - rgw-node
    #  tolerations:
    #  - key: rgw-node
    #    operator: Exists
    #  podAffinity:
    #  podAntiAffinity:
    #  topologySpreadConstraints:
    priorityClassName: system-cluster-critical
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 150m
        memory: 128Mi
  #zone:
    #name: zone-a
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-ca-issuer
    cert-manager.io/common-name: s3-dev.ceph.homelab.kbushby.com
    external-dns.alpha.kubernetes.io/hostname: s3-dev.ceph.homelab.kbushby.com
    external-dns.alpha.kubernetes.io/ttl: "3600"
  name: rook-ceph-s3-dev
  namespace: rook-ceph
spec:
  ingressClassName: nginx
  rules:
  - host: s3-dev.ceph.homelab.kbushby.com
    http:
      paths:
      - backend:
          service:
            name: rook-ceph-rgw-ceph-s3-dev
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - s3-dev.ceph.homelab.kbushby.com
    secretName: s3-dev-ceph-tls
