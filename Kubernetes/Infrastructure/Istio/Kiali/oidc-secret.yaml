apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-oidc-secret
  namespace: kiali
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    # name of the generated secret
    name: kiali
  data:
  - secretKey: oidc-secret # Name of the element in the generated secret
    remoteRef:
      key: kiali-oidc  # The path of the secret, relative from the secrets path
      property: secret  # name of the attribute to access