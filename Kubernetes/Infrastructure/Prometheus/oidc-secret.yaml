apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-secret
  namespace: kube-prom-stack
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    # name of the generated secret
    name: grafana-oidc-secret
  data:
  - secretKey: secret # Name of the element in the generated secret
    remoteRef:
      key: grafana-oidc  # The path of the secret, relative from the secrets path
      property: secret  # name of the attribute to access