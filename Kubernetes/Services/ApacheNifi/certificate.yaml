apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nifi-tls
  namespace: nifi
spec:
  dnsNames:
  - "nifi.homelab.kbushby.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-ca-issuer
  secretName: nifi-tls

  keystores:
    jks:
      create: true
      passwordSecretRef:
        name: nifi-tls-keystore
        key: password
    pkcs12:
      create: true
      passwordSecretRef:
        name: nifi-tls-keystore
        key: password
      profile: Modern2023
---
apiVersion: v1
kind: Secret
metadata:
  name: nifi-tls-keystore
  namespace: nifi
type: Opaque
data:
  password: ZTE4TzUwcTg0QkpBOVpzWkxNSE1qWGszdXk2emk1
  # echo -n "e18O50q84BJA9ZsZLMHMjXk3uy6zi5" | base64
