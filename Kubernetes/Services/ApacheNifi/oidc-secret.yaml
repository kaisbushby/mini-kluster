apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apache-nifi-oidc-secret
  namespace: nifi
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    # name of the generated secret
    name: apache-nifi-oidc-secret
  data:
  - secretKey: secret # Name of the element in the generated secret
    remoteRef:
      key: oidc/apache-nifi  # The path of the secret, relative from the secrets path
      property: secret  # name of the attribute to access

